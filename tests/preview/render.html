<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Market Preview</title>
<style>html,body{margin:0;background:#caa;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const params = new URLSearchParams(location.search);
const W = +(params.get('w') || 1280), H = +(params.get('h') || 720);
const file = params.get('file') || 'parts.json';
const data = await (await fetch(file)).json();

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf2b995);
scene.fog = new THREE.Fog(0xf0c0a0, 120, 520);

// golden-hour light: warm low sun + sky/ground fill
const hemi = new THREE.HemisphereLight(0xffe2c8, 0x6a5a6a, 1.1);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffc890, 2.4);
sun.position.set(-160, 90, -120);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
const sc = sun.shadow.camera; sc.left = -140; sc.right = 140; sc.top = 140; sc.bottom = -140; sc.far = 600;
sun.shadow.bias = -0.0005;
scene.add(sun);

const cylGeo = new THREE.CylinderGeometry(0.5, 0.5, 1, 20); cylGeo.rotateZ(Math.PI / 2);
const boxGeo = new THREE.BoxGeometry(1, 1, 1);
const ballGeo = new THREE.SphereGeometry(0.5, 20, 14);
function wedgeGeo() {
  // Roblox wedge: full bottom, tall face at +Z, slope down to the front (-Z)
  const g = new THREE.BufferGeometry();
  const v = [
    -0.5,-0.5,-0.5,  0.5,-0.5,-0.5,  0.5,-0.5,0.5,  -0.5,-0.5,0.5, // bottom 0-3
    -0.5,0.5,0.5,  0.5,0.5,0.5 // top back edge 4-5
  ];
  const idx = [0,2,1, 0,3,2,  3,4,5, 3,5,2,  0,1,5, 0,5,4,  0,4,3,  1,2,5];
  g.setAttribute('position', new THREE.Float32BufferAttribute(v, 3));
  g.setIndex(idx); g.computeVertexNormals(); return g;
}
const wGeo = wedgeGeo();

const matCache = new Map();
function material(p) {
  const key = [p.c.join(','), p.m, p.t].join('|');
  if (matCache.has(key)) return matCache.get(key);
  const color = new THREE.Color(p.c[0], p.c[1], p.c[2]);
  color.convertSRGBToLinear();
  const opts = { color, roughness: 0.8, metalness: 0 };
  if (p.m === 'Neon') { opts.emissive = color.clone(); opts.emissiveIntensity = 1.6; }
  if (p.m === 'Metal' || p.m === 'Foil' || p.m === 'DiamondPlate') { opts.metalness = 0.6; opts.roughness = 0.35; }
  if (p.m === 'Glass' || p.m === 'Ice') { opts.roughness = 0.1; }
  if (p.m === 'SmoothPlastic' || p.m === 'Marble') { opts.roughness = 0.5; }
  if (p.t > 0) { opts.transparent = true; opts.opacity = Math.max(0.08, 1 - p.t); opts.depthWrite = p.t < 0.4; }
  const m = new THREE.MeshStandardMaterial(opts);
  matCache.set(key, m); return m;
}

let count = 0;
for (const p of data.parts) {
  if (p.t >= 0.98) continue;
  let geo = boxGeo, sx = p.s[0], sy = p.s[1], sz = p.s[2];
  if (p.k === 'Ball') { geo = ballGeo; const d = Math.min(sx, sy, sz); sx = sy = sz = d; }
  else if (p.k === 'Cylinder') { geo = cylGeo; const d = Math.min(sy, sz); sy = sz = d; }
  else if (p.k === 'Wedge') { geo = wGeo; }
  const mesh = new THREE.Mesh(geo, material(p));
  const r = p.r; // x y z R00 R01 R02 R10 R11 R12 R20 R21 R22
  const m4 = new THREE.Matrix4().set(r[3], r[4], r[5], r[0], r[6], r[7], r[8], r[1], r[9], r[10], r[11], r[2], 0, 0, 0, 1);
  m4.multiply(new THREE.Matrix4().makeScale(sx, sy, sz));
  mesh.matrixAutoUpdate = false; mesh.matrix.copy(m4);
  mesh.castShadow = p.sh !== false && p.m !== 'Neon';
  mesh.receiveShadow = true;
  scene.add(mesh); count++;
}

// a handful of warm point lights so lanterns and fire glow on nearby surfaces
for (const l of (data.lights || []).slice(0, 24)) {
  const light = new THREE.PointLight(new THREE.Color(l.c[0], l.c[1], l.c[2]), l.b * 6, l.r * 1.2, 1.6);
  light.position.set(l.p[0], l.p[1], l.p[2]); scene.add(light);
}

// Plot 1 sits at +Z (0, 0, 66) facing the fountain, so its local axes line up with the world's.
const views = Object.assign({
  overview: { pos: [0, 150, -190], look: [0, 0, 10], fov: 50 },
  high: { pos: [0, 260, 1], look: [0, 0, 0], fov: 60 },
  plaza: { pos: [18, 9, 12], look: [0, 5, 60], fov: 60 },
  front: { pos: [0, 9, 28], look: [0, 6, 60], fov: 55 },
  shop: { pos: [0, 10, 74], look: [0, 3, 49], fov: 65 },
  aerial: { pos: [30, 40, 24], look: [0, 2, 60], fov: 50 },
  fountain: { pos: [16, 9, -16], look: [0, 6, 0], fov: 55 },
  side: { pos: [-40, 18, 64], look: [0, 4, 60], fov: 50 },
  inside: { pos: [0, 9.5, 70], look: [0, 3, 52], fov: 70 },
  left: { pos: [3, 8, 66], look: [-10.5, 2, 58], fov: 65 },
  right: { pos: [-3, 8, 66], look: [10.5, 2, 58], fov: 65 },
  top: { pos: [0.1, 70, 60], look: [0, 0, 60], fov: 45 },
  customer: { pos: [0, 6.5, 55], look: [0, 4.8, 48.5], fov: 60 },
  stars: { pos: [2, 7, 2], look: [12, 5.5, 20.8], fov: 55 },
  counter: { pos: [-6, 7.5, 40], look: [0, 4.5, 53], fov: 55 },
  faces: { pos: [1, 6.2, 40.5], look: [0, 5.2, 48.5], fov: 50 },
  cheer: { pos: [17, 6.5, 38], look: [10.6, 3.5, 49.2], fov: 55 },
}, data.views || {});
const view = views[params.get('view') || 'overview'] || { pos: [0, 140, -170], look: [0, 0, 0], fov: 50 };
const camera = new THREE.PerspectiveCamera(view.fov || 50, W / H, 0.5, 2000);
camera.position.set(...view.pos); camera.lookAt(new THREE.Vector3(...view.look));

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), 0.45, 0.5, 0.82));
composer.addPass(new OutputPass());
composer.render();
window.__stats = { parts: count, total: data.parts.length };
window.__ready = true;
</script>
</body>
</html>
